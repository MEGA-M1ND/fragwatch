name: Report

# Regenerates canonical tables from committed records. Offline by construction: it reads
# results/*/ JSONL records, never an API. AUDIT.md issue 5: this previously triggered on `main`,
# which does not exist in this repository, so it never ran on push.
on:
  push:
    branches: ["**"]
    paths:
      - "results/**"
      - "src/fragwatch/**"
      - ".github/workflows/report.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    name: Regenerate canonical report (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install report deps only
        run: pip install pytest==8.3.4
      - name: Guard against API use during reporting
        run: |
          # The report must not need credentials. Unset them so a regression fails loudly here
          # rather than silently spending money in CI.
          echo "OPENROUTER_API_KEY=" >> "$GITHUB_ENV"
      - name: Regenerate report
        run: |
          mkdir -p build
          python src/fragwatch/report.py results/hist_* --sweep | tee build/RESULTS.md
      - name: Fail if the report is empty or lost its calibration warning
        run: |
          test -s build/RESULTS.md
          grep -q "UNCALIBRATED" build/RESULTS.md
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-results-${{ github.sha }}
          path: build/RESULTS.md
          retention-days: 90
